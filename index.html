<style>
:root{--blue-700:rgb(3,112,179);--blue-500:rgb(0,110,182);--blue-400:rgb(50,162,212);--blue-900:rgb(2,67,116);--green-500:rgb(152,191,9);--green-600:rgb(0,146,63);--green-400:rgb(151,190,13);
--canvas:rgb(246,246,246);--gray-200:rgb(217,217,217);--gray-700:rgb(45,45,45);--font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--grad:linear-gradient(90deg,var(--blue-500),var(--green-400))}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--canvas);font-family:var(--font);color:var(--gray-700)}
.page{max-width:1800px;margin:0 auto;padding:18px 28px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
h1{margin:0;font-size:30px;font-weight:800;color:var(--blue-700);line-height:1.15}
.sub{margin:2px 0 0;font-size:13.5px;color:var(--gray-700)}
.logo{flex:none;width:58px;height:58px}
.logo svg{width:100%;height:100%;display:block}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--blue-500);background:transparent;color:var(--blue-700);border-radius:999px;padding:4px 16px;font:600 12px var(--font);cursor:pointer;transition:.2s}
.chip:hover{background:rgba(0,110,182,.08)}.chip.on:hover{background:var(--grad);background-origin:border-box;background-clip:border-box}.chip.on{background:var(--grad);background-origin:border-box;background-clip:border-box;color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border-radius:22px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.av{flex:none;width:56px;height:56px;border-radius:50%;object-fit:cover;background:#3c4f6e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.info{min-width:0}.name{font-weight:700;font-size:15px;color:#1c1c1c}.role{font-size:12.5px;color:#555;margin:1px 0}
.mail{font-size:12px;color:var(--blue-500);text-decoration:underline;word-break:break-all}.mail:hover{color:var(--blue-700)}
.badge{display:inline-block;margin-top:6px;border-radius:999px;padding:2px 12px;font-weight:700;font-size:11px}
.b-Líder{background:var(--blue-700);color:#fff}.b-Membro{background:#eceff4;color:#3c3c50}.b-Suporte{background:#6ea62a;color:#fff}
.work{font-size:12.5px;color:#444;margin-top:8px;line-height:1.45}.work b{color:var(--green-600)}
.help{background:#fff;border-radius:22px;padding:12px 20px;margin:0 0 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.help h2{margin:0 0 6px;font-size:14px;color:var(--blue-700)}
.help ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 24px}.help li{font-size:12.5px;line-height:1.45}.help li b{color:#1c1c1c}.help a{color:var(--blue-500)}
.hide{display:none}
</style></head><body><div class="page">

const g=document.getElementById("grid");
