:root{--blue-700:rgb(3,112,179);--blue-500:rgb(0,110,182);--blue-400:rgb(50,162,212);--blue-900:rgb(2,67,116);--green-500:rgb(152,191,9);--green-600:rgb(0,146,63);--green-400:rgb(151,190,13);
--canvas:rgb(246,246,246);--gray-200:rgb(217,217,217);--gray-700:rgb(45,45,45);--font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--grad:linear-gradient(90deg,var(--blue-500),var(--green-400))}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--canvas);font-family:var(--font);color:var(--gray-700)}
.page{max-width:1800px;margin:0 auto;padding:18px 28px 14px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
h1{margin:0;font-size:30px;font-weight:800;color:var(--blue-700);line-height:1.15}
.sub{margin:2px 0 0;font-size:13.5px;color:var(--gray-700)}
.logo{flex:none;width:58px;height:58px}
.logo svg{width:100%;height:100%;display:block}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2px solid var(--blue-500);background:transparent;color:var(--blue-700);border-radius:999px;padding:4px 16px;font:600 12px var(--font);cursor:pointer;transition:.2s}

const ini=n=>n.split(", ").reverse().map(s=>s[0]).join("").slice(0,2).toUpperCase();
const g=document.getElementById("grid");
g.innerHTML=P.map(p=>`<div class="card" data-r="${p.r}">${p.img?`<img class="av" src="${p.img}" alt="${p.n}" width="76" height="76">`:`<div class="av">${ini(p.n)}</div>`}<div class="info"><div class="name">${p.n}</div><div class="role">${p.c}</div><a class="mail" href="mailto:${p.e}">${p.e}</a><br><span class="badge b-${p.r}">${p.r}</span></div></div>`).join("");
const roles=["Todos","Líder","Membro","Suporte"],c=document.getElementById("chips");
c.innerHTML=roles.map((r,i)=>`<button class="chip${i?"":" on"}" data-r="${r}">${r}</button>`).join("");
c.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));g.querySelectorAll(".card").forEach(k=>k.classList.toggle("hide",b.dataset.r!=="Todos"&&k.dataset.r!==b.dataset.r))};
</script><script>
(function(){
  function fit(){
    var p=document.querySelector('.page');if(!p)return;
    p.style.zoom=1;document.body.style.overflowY='auto';
    var vh=window.innerHeight,z=1;
    for(var i=0;i<4;i++){
      var h=p.getBoundingClientRect().height;
      if(h<=vh+1&&z>=1)break;
      var nz=Math.max(0.6,Math.min(1,z*vh/h));
      if(Math.abs(nz-z)<0.005)break;
      z=nz;p.style.zoom=z;
    }
    document.body.style.overflowY=(p.getBoundingClientRect().height<=vh+1)?'hidden':'auto';
  }
  var raf=0;function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit);}
  window.addEventListener('resize',sched);
  document.getElementById('chips').addEventListener('click',sched);
  sched();setTimeout(fit,300);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
})();
</script>
